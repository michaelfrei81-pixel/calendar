<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa de Michael - Calendario</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales/es.global.min.js"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 15px; background-color: #f4f7f6; }
        #calendar { max-width: 900px; margin: 0 auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .fc-event { 
            cursor: pointer; 
            padding: 6px 0px; 
            font-size: 0.85em; 
            font-weight: bold; 
            background-color: #34495e !important; 
            border: none !important;
            color: #ffffff !important;
            text-align: center;
            border-radius: 0px !important; 
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .fc-event-start {
            border-top-left-radius: 20px !important;
            border-bottom-left-radius: 20px !important;
            margin-left: 20px !important;
            padding-left: 4px;
        }

        .fc-event-end {
            border-top-right-radius: 20px !important;
            border-bottom-right-radius: 20px !important;
            margin-right: 20px !important;
            padding-right: 4px;
        }

        .fc-daygrid-event-h-harness {
            border-radius: 0px !important;
            margin: 0 !important;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Casa de Michael</h2>
    <div id="calendar"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                displayEventTime: false, 
                locale: 'es',
                events: function(info, successCallback, failureCallback) {
                    var icalUrl = 'https://www.lodgify.com/35689b4e-016b-4ed7-8c67-cec74e5f1dd6.ics';
                    
                    // Uses JSONP / text bridge to bypass CORS without header blocking
                    var proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(icalUrl);

                    fetch(proxyUrl)
                        .then(function(response) {
                            if (!response.ok) throw new Error('Proxy network response error');
                            return response.json();
                        })
                        .then(function(json) {
                            var rawIcs = json.contents;
                            if (!rawIcs || rawIcs.indexOf('BEGIN:VCALENDAR') === -1) {
                                throw new Error('Invalid iCal payload received');
                            }

                            var jcalData = ICAL.parse(rawIcs);
                            var comp = new ICAL.Component(jcalData);
                            var vevents = comp.getAllSubcomponents('vevent');
                            
                            var events = vevents.map(function(vevent) {
                                var event = new ICAL.Event(vevent);
                                
                                var sYear = event.startDate.year;
                                var sMonth = event.startDate.month - 1; 
                                var sDay = event.startDate.day;
                                
                                var eYear = event.endDate.year;
                                var eMonth = event.endDate.month - 1;
                                var eDay = event.endDate.day;
                                
                                var startDate = new Date(sYear, sMonth, sDay);
                                var endDate = new Date(eYear, eMonth, eDay);
                                
                                var visualEndDate = new Date(endDate);
                                visualEndDate.setDate(visualEndDate.getDate() + 1);
                                
                                return {
                                    title: '',
                                    start: startDate,
                                    end: visualEndDate
                                };
                            });
                            
                            successCallback(events);
                        })
                        .catch(function(error) {
                            console.error('Calendar Fetch Error:', error);
                            // Fallback to secondary gateway if first JSON wrapper fails
                            fetch('https://cors.eu.org/' + icalUrl)
                                .then(function(r) { return r.text(); })
                                .then(function(rawText) {
                                    var jcalData = ICAL.parse(rawText);
                                    var comp = new ICAL.Component(jcalData);
                                    var vevents = comp.getAllSubcomponents('vevent');
                                    var events = vevents.map(function(vevent) {
                                        var ev = new ICAL.Event(vevent);
                                        var sD = new Date(ev.startDate.year, ev.startDate.month - 1, ev.startDate.day);
                                        var eD = new Date(ev.endDate.year, ev.endDate.month - 1, ev.endDate.day + 1);
                                        return { title: '', start: sD, end: eD };
                                    });
                                    successCallback(events);
                                })
                                .catch(function(finalErr) {
                                    failureCallback(finalErr);
                                });
                        });
                }
            });

            calendar.render();
        });
    </script>
</body>
</html>
