<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa de Michael</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales/es.global.min.js"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 10px; background-color: #f4f7f6; }
        #calendar { max-width: 900px; margin: 0 auto; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #debug-log { max-width: 900px; margin: 15px auto; padding: 10px; font-size: 12px; background: #eee; border-radius: 5px; color: #333; word-break: break-all; }
        
        .fc-event { 
            cursor: pointer; 
            padding: 5px 0px; 
            font-size: 0.85em; 
            font-weight: bold; 
            background-color: #34495e !important; 
            border: none !important;
            color: #ffffff !important;
            text-align: center;
            border-radius: 0px !important; 
            margin-top: 3px;
            margin-bottom: 3px;
        }

        .fc-event-start {
            border-top-left-radius: 18px !important;
            border-bottom-left-radius: 18px !important;
            margin-left: 15px !important;
            padding-left: 4px;
        }

        .fc-event-end {
            border-top-right-radius: 18px !important;
            border-bottom-right-radius: 18px !important;
            margin-right: 15px !important;
            padding-right: 4px;
        }

        .fc-daygrid-event-h-harness {
            border-radius: 0px !important;
            margin: 0 !important;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #333; margin-bottom: 15px;">Casa de Michael</h2>
    <div id="calendar"></div>
    <div id="debug-log">Cargando reservas...</div>

    <script>
        function logStatus(msg) {
            var el = document.getElementById('debug-log');
            if (el) el.innerText = msg;
        }

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                displayEventTime: false, 
                locale: 'es',
                events: function(info, successCallback, failureCallback) {
                    var icalUrl = 'https://www.lodgify.com/35689b4e-016b-4ed7-8c67-cec74e5f1dd6.ics';
                    
                    // Uses JSON wrapper to guarantee bypass of CORS 'Failed to fetch' blocks
                    var proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(icalUrl) + '&disableCache=true';

                    logStatus('Conectando con el calendario...');

                    fetch(proxyUrl)
                        .then(function(res) {
                            if (!res.ok) throw new Error('Proxy status: ' + res.status);
                            return res.json();
                        })
                        .then(function(data) {
                            var rawIcs = data.contents;
                            if (!rawIcs || rawIcs.indexOf('BEGIN:VCALENDAR') === -1) {
                                throw new Error('Feed inválido recibido.');
                            }

                            var jcalData = ICAL.parse(rawIcs);
                            var comp = new ICAL.Component(jcalData);
                            var vevents = comp.getAllSubcomponents('vevent');
                            
                            var events = vevents.map(function(vevent) {
                                var ev = new ICAL.Event(vevent);
                                var sDate = new Date(ev.startDate.year, ev.startDate.month - 1, ev.startDate.day);
                                var eDate = new Date(ev.endDate.year, ev.endDate.month - 1, ev.endDate.day + 1);
                                
                                return {
                                    title: '',
                                    start: sDate,
                                    end: eDate
                                };
                            });

                            logStatus('Éxito: Se cargaron ' + events.length + ' reservas.');
                            successCallback(events);
                        })
                        .catch(function(err) {
                            logStatus('Error al cargar: ' + err.message);
                            failureCallback(err);
                        });
                }
            });

            calendar.render();
        });
    </script>
</body>
</html>
