name: Sync Lodgify Calendar

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch: # Allows you to click "Run workflow" manually anytime

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Lodgify iCal
        env:
          # Held as a repository secret rather than written here. This repo is
          # public, and the feed URL is the only thing protecting the calendar:
          # anyone holding it can read every booking.
          FEED_URL: ${{ secrets.LODGIFY_ICAL_URL }}
        run: |
          set -euo pipefail

          if [ -z "${FEED_URL:-}" ]; then
            echo "::error::LODGIFY_ICAL_URL secret is not set. Refusing to run."
            exit 1
          fi

          # Downloaded to a candidate file, not straight over calendar.ics.
          # -f makes an HTTP error an actual failure instead of a saved error
          # page, and -S lets curl say what went wrong.
          curl -sSfL "$FEED_URL" -o candidate.ics

          # A rotated or revoked feed URL can still answer 200 with an HTML
          # page. Publishing that would look like a calendar with no bookings,
          # and downstream that is indistinguishable from "every guest
          # cancelled" — which would wipe the real schedule. So the file has to
          # prove it is a calendar before it is allowed to replace the last
          # good one.
          if ! grep -q "BEGIN:VCALENDAR" candidate.ics; then
            echo "::error::Downloaded file is not an iCal feed. Refusing to publish."
            echo "First 300 bytes of what arrived:"
            head -c 300 candidate.ics || true
            exit 1
          fi

          events=$(grep -c "BEGIN:VEVENT" candidate.ics || true)
          echo "Feed contains ${events} events."

          if [ "${events}" -eq 0 ]; then
            echo "::error::Feed parsed but contains no events. Refusing to publish."
            exit 1
          fi

          mv candidate.ics calendar.ics

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync Lodgify calendar" && git push)
